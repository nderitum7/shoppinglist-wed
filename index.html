
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shopping List Website</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Story+Script&display=swap" rel="stylesheet">
</head>

<body>
    <div id="container">
        <h1>Interactive Shopping List</h1>

        <form id="shoppingForm">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" name="itemName">

            <label for="itemPrice">Item Price</label>
            <input type="number" id="itemPrice" name="itemPrice" min="0.01" step="0.01">

            <button id="addItem" type="submit">Add</button>
            <button id="clearItem" type="button">Clear</button>
        </form>
    </div>

    <section id="list-container">
        <h2>My Shopping Items</h2>

        <div id="itemDisplay"></div>

        <h3>Total Cost: KSh <span id="totalCost">0.00</span></h3>
    </section>

    <script src="script.js"></script>
</body>
</html>
